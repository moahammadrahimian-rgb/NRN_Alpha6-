<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00ffcc">
<link rel="manifest" href="/manifest.json">
<title>NEURON ALPHA-6</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma, sans-serif; }
  body { background:#0a0e1a; color:#00ffcc; padding:20px; min-height:100vh; }
  h1 { text-align:center; margin-bottom:20px; font-size:22px; }
  .box { background:#111827; border:1px solid #00ffcc33; border-radius:10px; padding:15px; margin-bottom:15px; }
  .status { font-size:14px; line-height:2; }
  button { background:#00ffcc; color:#0a0e1a; border:none; padding:12px; border-radius:6px; font-weight:bold; margin-top:10px; width:100%; font-size:14px; }
  #result { margin-top:15px; font-size:12px; max-height:300px; overflow-y:auto; }
  .ok { color:#00ff88; } .fail { color:#ff4466; }
</style>
</head>
<body>
<h1>🧠 NEURON ALPHA-6</h1>
<div class="box">
  <div class="status" id="status">در حال بارگذاری...</div>
  <button onclick="checkStatus()">بررسی وضعیت</button>
</div>
<div class="box">
  <button onclick="runAll()">اجرای ۳۴۲ ماژول</button>
  <div id="result"></div>
</div>
<script>
async function checkStatus() {
  try {
    const r = await fetch("/api/modules/status");
    const d = await r.json();
    document.getElementById("status").innerHTML =
      "پروژه: " + d.project + "<br>نسخه: " + d.version +
      "<br>کل: " + d.total + "<br>سالم: <span class='ok'>" + d.loaded +
      "</span><br>ناقص: <span class='fail'>" + d.missing + "</span>";
  } catch(e) { document.getElementById("status").innerHTML = "⚠ سرور وصل نیست"; }
}
async function runAll() {
  try {
    const r = await fetch("/api/modules/run-all");
    const d = await r.json();
    document.getElementById("result").innerHTML =
      "<b>نتیجه:</b><br>سالم: <span class='ok'>" + d.passed +
      "</span><br>خطا: <span class='fail'>" + d.failed + "</span><br>کل: " + d.total;
  } catch(e) { document.getElementById("result").innerHTML = "⚠ خطا"; }
}
checkStatus();
</script>
</body>
</html>
