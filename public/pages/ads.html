<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/mobile.css">
<title>تبلیغات</title>
</head>
<body>
<div class="container">
<div class="card">
<h2>تبلیغات</h2>
<input id="title" placeholder="عنوان تبلیغ">
<textarea id="content" placeholder="متن تبلیغ"></textarea>
<button onclick="addAd()">ثبت تبلیغ</button>
<button onclick="loadAds()">نمایش تبلیغات</button>
<pre id="out"></pre>
</div>
</div>
<script src="/js/app.js"></script>
<script>
async function addAd(){
 out.textContent=JSON.stringify(
  await api("/api/ads",{
   method:"POST",
   body:JSON.stringify({
    title:title.value,
    content:content.value
   })
  }),null,2
 );
}
async function loadAds(){
 out.textContent=JSON.stringify(
  await api("/api/ads"),null,2
 );
}
loadAds();
</script>
</body>
</html>
