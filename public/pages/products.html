<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/mobile.css">
<title>محصولات</title>
</head>
<body>
<div class="container">
<div class="card">
<h2>محصولات</h2>
<input id="title" placeholder="نام محصول">
<input id="price" type="number" placeholder="قیمت">
<button onclick="addProduct()">افزودن محصول</button>
<button onclick="loadProducts()">نمایش محصولات</button>
<pre id="out"></pre>
</div>
</div>
<script src="/core/network/network-state.js"></script>
<script src="/core/sync/offline-queue.js"></script>
<script src="/core/network/retry.js"></script>
<script src="/core/sync/sync-engine.js"></script>
<script src="/js/app.js"></script>
<script>
async function addProduct(){
 out.textContent=JSON.stringify(
  await api("/api/products",{
   method:"POST",
   body:JSON.stringify({
    title:title.value,
    price:price.value
   })
  }),null,2
 );
}
async function loadProducts(){
 out.textContent=JSON.stringify(
  await api("/api/products"),null,2
 );
}
loadProducts();
</script>
</body>
</html>
